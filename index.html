<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo/logo-mark.svg" />
    <link rel="apple-touch-icon" href="/logo/logo-mark.svg" />
    <meta name="theme-color" content="#F8FAFC" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="BoxTruckManage is the dispatch platform for box truck fleets: a live load board that picks the nearest truck, bids from your own mailbox, broker conversations, tracking, hiring, payouts and factoring, plus the BTM Driver and BTM Dispatch apps. Try the live demo, no sign-up."
    />
    <meta property="og:title" content="BoxTruckManage - Box truck dispatch, from posted load to paid driver" />
    <meta property="og:description" content="Live load board, nearest-truck matching, bids from your own mailbox, tracking, payouts and driver apps. Try the live demo, no sign-up." />
    <meta property="og:url" content="https://boxtruckmanage.com" />
    <meta property="og:type" content="website" />
    <title>BoxTruckManage - Box Truck Dispatch Platform with a Live Demo</title>
    <script>
      /* Paint the stored theme before the first frame, so a dark choice never flashes light. */
      try {
        var t = localStorage.getItem('btm-landing-theme')
        if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t
        if (t === 'dark') document.querySelector('meta[name="theme-color"]').content = '#070B18'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
